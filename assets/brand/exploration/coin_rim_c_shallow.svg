<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Currency Converter shallow dimensional-rim icon</title>
  <desc id="desc">A smooth amber coin rim with restrained highlight and shade arcs, a cream face, and two large opposing exchange arrows.</desc>

  <rect width="1024" height="1024" rx="220" fill="#285F3B"/>

  <circle cx="512" cy="512" r="330" fill="#B99A52"/>
